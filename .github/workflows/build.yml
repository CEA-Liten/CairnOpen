name: cairn Workflow
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  #job1: build
  cairn-build:
    runs-on: ubuntu-latest
    outputs: #vars used on next jobs
      cairn_version: ${{ steps.extract.outputs.cairn_version }}
      whl_filename: ${{ steps.extract.outputs.whl_filename }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update submodules
        run: git submodule update --init --recursive --remote
      
      - name: Set CAIRN_HOME
        run: echo "CAIRN_HOME=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: buildALL
        run: bash ./buildAll.sh
      
      - name: TNR PyTest
        run: bash ./tests/scripts/startPytest.sh
        continue-on-error: true
      - name: TNR CTest
        run: bash ./tests/startCtest.sh
        continue-on-error: true
      - name: Publish TNR reports
        uses: phoenix-actions/test-reporting@v2
        continue-on-error: true
        with:
          files: tests/reports/*.xml
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: extract version
        id: extract #mandatory for $GITHUB_OUTPUT
        run: |
          set -e
          CAIRN_VERSION=$(tail -n 1 resources/officialVersions.txt)
          WHL_FILENAME="cairn-${CAIRN_VERSION}-cp313-cp313-linux_x86_64.whl"
          echo "cairn_version=$CAIRN_VERSION" >> $GITHUB_OUTPUT
          echo "whl_filename=$WHL_FILENAME" >> $GITHUB_OUTPUT

      - name: upload bin folder 
        uses: actions/upload-artifact@v4
        with:
          name: cairn-bin
          path: bin/
          retention-days: 1
      - name: upload wheel setup files 
        uses: actions/upload-artifact@v4
        with:
          name: wheel-setup-pyproject
          path: |
            pyproject.toml
            setup.py
          retention-days: 1
  
  #job2: docs
  docs:
    runs-on: ubuntu-latest
    needs: cairn-build

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update submodules
        run: git submodule update --init --recursive --remote
      - name: download bin folder
        uses: actions/download-artifact@v4
        with:
          name: cairn-bin
          path: bin/
      - name: set vars
        run: |
          echo "CAIRN_VERSION=${{ needs.cairn-build.outputs.cairn_version }}" >> $GITHUB_ENV
          echo "WHL_FILENAME=${{ needs.cairn-build.outputs.whl_filename }}" >> $GITHUB_ENV

      - name: (docs) Install wheel dependencies
        run: |
          set -e
          python --version
          pip install bin/$WHL_FILENAME
          pip install -r ./doc/user/requirements.txt
          python ./scripts/doc/userDocGenRST.py
      - name: (docs) Sphinx build
        run: |
          sphinx-build -M html ./doc/user/ ./doc/user/_build
      - name: (docs) Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/user/_build/html
          force_orphan: true

  #job3: upload wheel
  uploads:
    runs-on: ubuntu-latest
    needs: cairn-build

    steps:
      - name: download bin folder
        uses: actions/download-artifact@v4
        with:
          name: cairn-bin
          path: bin/
      - name: set vars
        run: |
          echo "CAIRN_VERSION=${{ needs.cairn-build.outputs.cairn_version }}" >> $GITHUB_ENV
          echo "WHL_FILENAME=${{ needs.cairn-build.outputs.whl_filename }}" >> $GITHUB_ENV

    #upload wheel file
      - name: upload wheel on workflow 
        uses: actions/upload-artifact@v4
        with:
          name: cairn-wheel-linux-${{ env.CAIRN_VERSION }}
          path: bin/${{ env.WHL_FILENAME }}
      
      - name: Upload on release 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ env.CAIRN_VERSION }} bin/${{ env.WHL_FILENAME }} --repo ${{ github.repository }} --clobber 
  
  #job4 build wheel on other platforms (windows)
  build-wheels:
    name: Build wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    needs: cairn-build
    strategy:
      matrix:
        include:
          - os: windows
            runs-on: windows-latest
            platform: win_amd64
          #- os: linux
          #  runs-on: ubuntu-latest
          #  platform: linux_x86_64

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: download wheel setup files
        uses: actions/download-artifact@v4
        with:
          name: wheel-setup-pyproject
          path: .
      - name: set vars
        run: |
          echo "CAIRN_VERSION=${{ needs.cairn-build.outputs.cairn_version }}" >> $GITHUB_ENV
          echo "WHL_FILENAME=cairn-${{ env.CAIRN_VERSION }}-cp313-cp313-${{ matrix.platform }}.whl" >> $GITHUB_ENV

      - name: Build wheel via pypa/cibuildwheel
        uses: pypa/cibuildwheel@v3.3.1
        with:
          package-dir: .
          output-dir: cibuildwheel
      - uses: actions/upload-artifact@v4
        with:
          name: cairn-wheel-${{ matrix.os }}-${{ env.CAIRN_VERSION }}
          path: ./cibuildwheel/*.whl
      - name: Upload on release 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WHEEL_FILENAME=""
          gh release upload ${{ env.CAIRN_VERSION }} cibuildwheel/$WHEEL_FILENAME --repo ${{ github.repository }} --clobber 
  

  #job5: upload on pypi.org (TODO)
  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/cairnopen

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
      