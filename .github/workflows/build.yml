name: cairn Workflow
on:
  push:
    branches:
      - ci-cd #TBR

jobs:
  cairn-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update submodules
        run: git submodule update --init --recursive --remote
      
      - name: buildALL
        run: bash ./buildAll.sh
      - name: TNR Tests
        run: bash ./tests/scripts/startPytest.sh
 
