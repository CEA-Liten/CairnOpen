name: cairn Workflow
on:
  push:
    branches:
      - ci-cd #TBR

jobs:
  cairn-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update submodules
        run: git submodule update --init --recursive --remote
      
      - name: Set CAIRN_HOME
        run: echo "CAIRN_HOME=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: buildALL
        run: bash ./buildAll.sh
      # - name: TNR Tests
      #   run: bash ./tests/scripts/startPytest.sh
 
