name: cairn Workflow
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cairn-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update submodules
        run: git submodule update --init --recursive --remote
      
      - name: Set CAIRN_HOME
        run: echo "CAIRN_HOME=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: buildALL
        run: bash ./buildAll.sh
  
  docs:
    needs: cairn-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: extract version
        run: |
          set -e
          CAIRN_VERSION=$(tail -n 1 resources/officialVersions.txt)
          WHL_FILENAME="cairn-${CAIRN_VERSION}-cp313-cp313-linux_x86_64.whl"
          echo "CAIRN_VERSION=$CAIRN_VERSION" >> $GITHUB_ENV
          echo "WHL_FILENAME=$WHL_FILENAME" >> $GITHUB_ENV
      
      - name: Install dependencies
        run: |
          set -e
          python --version
          pip install bin/$WHL_FILENAME
          pip install -r ./doc/user/requirements.txt
          python ./scripts/doc/userDocGenRST.py
      - name: Sphinx build
        run: |
          sphinx-build -M html ./doc/user/ ./doc/user/_build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/user/_build/html
          force_orphan: true

      #TODO 
